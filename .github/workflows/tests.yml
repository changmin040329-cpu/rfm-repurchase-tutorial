name: tests

# Runs the leakage/format tests on every pull request and on main.
# The tests use a tiny synthetic dataset, so nothing is downloaded (takes ~1 minute).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
